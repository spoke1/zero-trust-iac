name: Deploy

# Manual only. Every run shows a what-if first; "deploy" applies it afterwards.
# Authentication uses OpenID Connect (federated credentials), so no client secret exists.
# Configure the GitHub environments "dev" and "prod" as described in docs/deployment.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      mode:
        description: Show the what-if only, or deploy after the what-if
        type: choice
        options: [what-if, deploy]
        default: what-if
      location:
        description: Deployment location (also the default region of the resources)
        type: string
        default: westeurope

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TEMPLATE: bicep/main.bicep
      PARAMS: bicep/main.${{ inputs.environment }}.bicepparam
      DEPLOYMENT_NAME: zero-trust-foundation-${{ inputs.environment }}
      LOCATION: ${{ inputs.location }}
    steps:
      - uses: actions/checkout@v7

      - name: Check environment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set for environment '${{ inputs.environment }}'. See docs/deployment.md."
              missing=1
            fi
          done
          exit $missing

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: What-if
        run: |
          az deployment sub what-if \
            --name "$DEPLOYMENT_NAME" \
            --location "$LOCATION" \
            --template-file "$TEMPLATE" \
            --parameters "$PARAMS"

      - name: Deploy
        if: inputs.mode == 'deploy'
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location "$LOCATION" \
            --template-file "$TEMPLATE" \
            --parameters "$PARAMS" \
            --output table
