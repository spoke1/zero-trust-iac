name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Bicep lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: |
          az bicep install
          az bicep version

      - name: Lint (bicepconfig.json rules)
        run: az bicep lint --file bicep/main.bicep

      - name: Build template and parameter files
        run: |
          az bicep build --file bicep/main.bicep --stdout > /dev/null
          for params in bicep/*.bicepparam; do
            echo "Building $params"
            az bicep build-params --file "$params" --stdout > /dev/null
          done

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
